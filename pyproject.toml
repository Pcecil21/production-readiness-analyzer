[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "production-readiness-analyzer"
version = "0.1.0"
description = "CLI tool that audits codebases for production readiness"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Peter Cecil" }]
keywords = ["devops", "production", "readiness", "audit", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
production-readiness-analyzer = "analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
